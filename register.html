<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Taskora</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #635bff;
      --primary-dark: #4f46e5;
      --secondary: #8b5cf6;
      --dark: #111827;
      --text: #374151;
      --muted: #6b7280;
      --border: #e5e7eb;
      --white: #ffffff;
      --light: #f7f8ff;
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(99, 91, 255, 0.13),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(139, 92, 246, 0.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #ffffff,
          #f7f8ff
        );
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font-family: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      height: 76px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      width: min(1180px, 92%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--dark);
      font-size: 21px;
      font-weight: 800;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
      );
      box-shadow:
        0 8px 22px rgba(99, 91, 255, 0.25);
    }

    .home-link {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      transition: 0.2s;
    }

    .home-link:hover {
      color: var(--primary);
    }

    /* =========================
       MAIN
    ========================== */

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 48px 20px 65px;
    }

    .register-wrapper {
      width: 100%;
      max-width: 500px;
    }

    .register-card {
      padding: 38px;
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow:
        0 25px 70px rgba(31, 41, 55, 0.10);
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      color: var(--primary);
      background: #f0efff;
      font-size: 23px;
      font-weight: 800;
    }

    .welcome h1 {
      color: var(--dark);
      font-size: 29px;
      letter-spacing: -0.8px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       FORM
    ========================== */

    .form-group {
      margin-bottom: 17px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 14px;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 49px;
      padding: 0 14px 0 42px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      color: var(--dark);
      background: white;
      font-size: 14px;
      transition: 0.2s;
    }

    input::placeholder {
      color: #a5a9b3;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 4px rgba(99, 91, 255, 0.09);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #8b909b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px;
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    /* =========================
       PASSWORD STRENGTH
    ========================== */

    .password-strength {
      display: none;
      margin-top: 8px;
    }

    .strength-bars {
      display: flex;
      gap: 4px;
      margin-bottom: 5px;
    }

    .strength-bars span {
      height: 4px;
      flex: 1;
      border-radius: 10px;
      background: #e5e7eb;
    }

    .strength-text {
      color: var(--muted);
      font-size: 10px;
    }

    /* =========================
       TERMS
    ========================== */

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 20px 0 22px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .terms input {
      width: 15px;
      height: 15px;
      padding: 0;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: var(--primary);
      box-shadow: none;
    }

    .terms a {
      color: var(--primary);
      font-weight: 700;
    }

    /* =========================
       BUTTON
    ========================== */

    .register-button {
      width: 100%;
      height: 51px;
      border: none;
      border-radius: 12px;
      color: white;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
      box-shadow:
        0 10px 25px rgba(99, 91, 255, 0.22);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s;
    }

    .register-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 30px rgba(99, 91, 255, 0.28);
    }

    .register-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       LOGIN LINK
    ========================== */

    .login-text {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .login-text a {
      color: var(--primary);
      font-weight: 800;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    /* =========================
       SECURITY
    ========================== */

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 21px;
      color: #8b909b;
      font-size: 10px;
    }

    .security-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: #f0fdf4;
      color: var(--success);
      font-size: 11px;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      padding: 20px;
      text-align: center;
      color: #8b909b;
      font-size: 10px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 520px) {

      header {
        height: 68px;
      }

      .logo {
        font-size: 18px;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        border-radius: 11px;
      }

      .home-link {
        font-size: 12px;
      }

      main {
        padding: 30px 14px 45px;
      }

      .register-card {
        padding: 27px 21px;
        border-radius: 20px;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .welcome-icon {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- =========================
         HEADER
    ========================== -->

    <header>

      <div class="header-inner">

        <a href="index.html" class="logo">

          <span class="logo-icon">
            T
          </span>

          <span>
            Taskora
          </span>

        </a>

        <a href="index.html" class="home-link">
          ← Back to Home
        </a>

      </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main>

      <div class="register-wrapper">

        <div class="register-card">

          <div class="welcome">

            <div class="welcome-icon">
              +
            </div>

            <h1>
              Create Your Account
            </h1>

            <p>
              Join Taskora and start exploring tasks,
              building skills and managing your earnings.
            </p>

          </div>


          <form id="registerForm">

            <!-- Full Name -->

            <div class="form-group">

              <label
                class="form-label"
                for="fullName"
              >
                Full Name
              </label>

              <div class="input-wrapper">

                <span class="input-icon">
                  ◉
                </span>

                <input
                  type="text"
                  id="fullName"
                  name="fullName"
                  placeholder="Enter your full name"
                  autocomplete="name"
                  required
                >

              </div>

            </div>


            <!-- Email -->

            <div class="form-group">

              <label
                class="form-label"
                for="email"
              >
                Email Address
              </label>

              <div class="input-wrapper">

                <span class="input-icon">
                  @
                </span>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email address"
                  autocomplete="email"
                  required
                >

              </div>

            </div>


            <!-- Password -->

            <div class="form-group">

              <label
                class="form-label"
                for="password"
              >
                Password
              </label>

              <div class="input-wrapper">

                <span class="input-icon">
                  ●
                </span>

                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  minlength="8"
                  required
                >

                <button
                  type="button"
                  class="password-toggle"
                  id="togglePassword"
                >
                  Show
                </button>

              </div>

              <div
                class="password-strength"
                id="passwordStrength"
              >

                <div class="strength-bars">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </div>

                <div
                  class="strength-text"
                  id="strengthText"
                >
                  Password strength
                </div>

              </div>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

              <label
                class="form-label"
                for="confirmPassword"
              >
                Confirm Password
              </label>

              <div class="input-wrapper">

                <span class="input-icon">
                  ●
                </span>

                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm your password"
                  autocomplete="new-password"
                  required
                >

                <button
                  type="button"
                  class="password-toggle"
                  id="toggleConfirm"
                >
                  Show
                </button>

              </div>

            </div>


            <!-- Terms -->

            <label class="terms">

              <input
                type="checkbox"
                id="terms"
                required
              >

              <span>
                I agree to Taskora's
                <a href="about.html">
                  Terms & Conditions
                </a>
                and understand the platform rules.
              </span>

            </label>


            <!-- Submit -->

            <button
              type="submit"
              class="register-button"
              id="registerButton"
            >
              Create Account
            </button>

          </form>


          <!-- Login -->

          <div class="login-text">

            Already have an account?

            <a href="login.html">
              Login
            </a>

          </div>


          <!-- Security -->

          <div class="security-note">

            <span class="security-icon">
              ✓
            </span>

            <span>
              Your account information is protected.
            </span>

          </div>

        </div>

      </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

      © 2026 Taskora. All Rights Reserved.

    </footer>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const passwordInput =
      document.getElementById("password");

    const confirmInput =
      document.getElementById("confirmPassword");

    const togglePassword =
      document.getElementById("togglePassword");

    const toggleConfirm =
      document.getElementById("toggleConfirm");


    togglePassword.addEventListener(
      "click",
      function () {

        if (passwordInput.type === "password") {

          passwordInput.type = "text";
          togglePassword.textContent = "Hide";

        } else {

          passwordInput.type = "password";
          togglePassword.textContent = "Show";

        }

      }
    );


    toggleConfirm.addEventListener(
      "click",
      function () {

        if (confirmInput.type === "password") {

          confirmInput.type = "text";
          toggleConfirm.textContent = "Hide";

        } else {

          confirmInput.type = "password";
          toggleConfirm.textContent = "Show";

        }

      }
    );


    /* Password strength */

    const passwordStrength =
      document.getElementById("passwordStrength");

    const strengthText =
      document.getElementById("strengthText");

    const strengthBars =
      passwordStrength.querySelectorAll(
        ".strength-bars span"
      );


    passwordInput.addEventListener(
      "input",
      function () {

        const value = passwordInput.value;

        passwordStrength.style.display =
          value.length > 0 ? "block" : "none";

        let score = 0;

        if (value.length >= 8) {
          score++;
        }

        if (/[A-Z]/.test(value)) {
          score++;
        }

        if (/[0-9]/.test(value)) {
          score++;
        }

        if (/[^A-Za-z0-9]/.test(value)) {
          score++;
        }

        strengthBars.forEach(
          function (bar, index) {

            bar.style.background =
              index < score
                ? "#635bff"
                : "#e5e7eb";

          }
        );


        if (score <= 1) {

          strengthText.textContent =
            "Weak password";

        } else if (score === 2) {

          strengthText.textContent =
            "Fair password";

        } else if (score === 3) {

          strengthText.textContent =
            "Good password";

        } else {

          strengthText.textContent =
            "Strong password";

        }

      }
    );


    /* Registration */

    const registerForm =
      document.getElementById("registerForm");


    registerForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmInput.value;


        if (password !== confirmPassword) {

          alert(
            "Passwords do not match."
          );

          return;

        }


        if (password.length < 8) {

          alert(
            "Password must contain at least 8 characters."
          );

          return;

        }


        /*
          Firebase Authentication will be
          connected here later.
        */

        alert(
          "Account registration will be connected after Firebase setup."
        );

      }
    );

  </script>

</body>
</html>
